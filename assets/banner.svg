<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Drop Shadows & Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <style>
      .laser-line {
        animation: scanVertical 4s ease-in-out infinite alternate;
      }
      .float-pill-1 {
        animation: floatSlow 6s ease-in-out infinite alternate;
      }
      .float-pill-2 {
        animation: floatReverse 7s ease-in-out infinite alternate;
      }
      .pulse-glow {
        animation: pulseGlowAnim 5s ease-in-out infinite alternate;
      }
      .stream-dash {
        stroke-dasharray: 8 12;
        animation: dashMove 3s linear infinite;
      }

      @keyframes scanVertical {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(140px); opacity: 0.2; }
      }
      @keyframes floatSlow {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px); }
        100% { transform: translateY(10px); }
      }
      @keyframes pulseGlowAnim {
        0% { transform: scale(0.95); opacity: 0.5; }
        100% { transform: scale(1.08); opacity: 0.85; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="380" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Animated Glows in Background -->
  <g class="pulse-glow" transform-origin="600 190">
    <circle cx="600" cy="190" r="320" fill="url(#glowPulse)" />
  </g>
  <circle cx="150" cy="80" r="180" fill="url(#glowPulse)" opacity="0.4" />
  <circle cx="1060" cy="300" r="160" fill="url(#glowPulse)" opacity="0.4" />

  <!-- Dynamic Circuit / Pipeline Streams (Background) -->
  <g opacity="0.4">
    <!-- Stream 1 -->
    <path d="M 80 190 Q 250 120 400 190 T 700 190" fill="none" stroke="#38bdf8" stroke-width="1.5" class="stream-dash" />
    <!-- Stream 2 -->
    <path d="M 500 190 Q 750 260 900 190 T 1120 190" fill="none" stroke="#818cf8" stroke-width="1.5" class="stream-dash" />
  </g>

  <!-- Animated Floating Feature Pills (Soft, Translucent in Midground) -->
  <g class="float-pill-1" transform-origin="120 90" opacity="0.75">
    <rect x="70" y="65" width="120" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="130" y="86" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Deep OCR</text>
  </g>

  <g class="float-pill-2" transform-origin="1060 80" opacity="0.75">
    <rect x="1000" y="65" width="140" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="1070" y="86" fill="#c7d2fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 Vision LLMs</text>
  </g>

  <g class="float-pill-2" transform-origin="100 290" opacity="0.75">
    <rect x="60" y="275" width="135" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="127" y="296" fill="#e9d5ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">📑 Layout Analysis</text>
  </g>

  <g class="float-pill-1" transform-origin="1050 290" opacity="0.75">
    <rect x="990" y="275" width="150" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="1065" y="296" fill="#a7f3d0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔍 RAG & Parsing</text>
  </g>

  <!-- Floating Document Glyph on Left with Animated Laser Scan -->
  <g transform="translate(140, 115) scale(0.85)" opacity="0.85">
    <!-- Document Card -->
    <rect x="0" y="0" width="110" height="140" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
    <path d="M 80 0 L 110 30 L 110 140 A 10 10 0 0 1 100 150 L 10 150 A 10 10 0 0 1 0 140 L 0 10 A 10 10 0 0 1 10 0 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <!-- Document text lines -->
    <line x1="20" y1="40" x2="65" y2="40" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="58" x2="90" y2="58" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="76" x2="85" y2="76" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="94" x2="70" y2="94" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="112" x2="80" y2="112" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <!-- Animated Scanning Laser Line -->
    <g class="laser-line">
      <line x1="-5" y1="0" x2="115" y2="0" stroke="#38bdf8" stroke-width="2.5" filter="url(#softGlow)" />
      <polygon points="50,-3 60,-3 55,3" fill="#38bdf8" />
    </g>
  </g>

  <!-- Floating Multi-modal Graph on Right -->
  <g transform="translate(930, 120) scale(0.85)" opacity="0.85">
    <circle cx="50" cy="30" r="16" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="50" y="34" fill="#c7d2fe" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">IMG</text>
    
    <circle cx="110" cy="70" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="110" y="74" fill="#7dd3fc" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">PDF</text>

    <circle cx="40" cy="110" r="16" fill="#311042" stroke="#c084fc" stroke-width="2" />
    <text x="40" y="114" fill="#f5d0fe" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">JSON</text>

    <line x1="62" y1="40" x2="95" y2="60" stroke="#475569" stroke-width="1.5" />
    <line x1="95" y1="80" x2="54" y2="102" stroke="#475569" stroke-width="1.5" />
    <circle cx="78" cy="50" r="3" fill="#38bdf8">
      <animate attributeName="cx" values="62;95;62" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="40;60;40" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTAINER: Solid High-Contrast, Always Legible -->
  <g id="foreground-content" filter="url(#titleShadow)">
    <!-- Top Pill / Badge -->
    <g transform="translate(600, 72)">
      <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#0f172a" stroke="url(#accentGradient)" stroke-width="1.5" />
      <text x="0" y="5" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">✨ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5">
      <tspan fill="#ffffff">Awesome </tspan>
      <tspan fill="url(#accentGradient)">Document Intelligence</tspan>
    </text>

    <!-- Subtitle -->
    <text x="600" y="196" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" font-weight="500" text-anchor="middle">
      Intelligent Document Processing (IDP) • Multimodal Vision AI • OCR &amp; Structured Extraction
    </text>

    <text x="600" y="226" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" text-anchor="middle">
      Enterprise SaaS Solutions, Transparent Pricing &amp; Top Ranked Open-Source GitHub Repositories
    </text>

    <!-- Bottom Highlights Bar -->
    <g transform="translate(600, 290)">
      <!-- Highlight Card 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-90" y="-20" width="180" height="40" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🏢 Enterprise SaaS &amp; IDP</text>
      </g>

      <!-- Highlight Card 2 -->
      <g transform="translate(-105, 0)">
        <rect x="-95" y="-20" width="190" height="40" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">⭐ 20+ Open-Source Engines</text>
      </g>

      <!-- Highlight Card 3 -->
      <g transform="translate(110, 0)">
        <rect x="-95" y="-20" width="190" height="40" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">💰 Exact Pricing &amp; Limits</text>
      </g>

      <!-- Highlight Card 4 -->
      <g transform="translate(320, 0)">
        <rect x="-90" y="-20" width="180" height="40" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
        <text x="0" y="5" fill="#f8fafc" font-family="sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">🤖 RAG &amp; LLM Pipelines</text>
      </g>
    </g>
  </g>
</svg>